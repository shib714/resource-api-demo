<mat-toolbar>
  <button mat-icon-button aria-label="nav icon-button with menu icon" (click)="drawer.toggle()">
    <mat-icon>menu</mat-icon>
  </button>
  <span>Resource API Demo in Angular 22</span>
  <span class="nav-spacer"></span>

  <button mat-icon-button class="nav-icon" aria-label="nav icon-button with share icon">
    <mat-icon>logout</mat-icon>
  </button>

  <button mat-icon-button [mat-menu-trigger-for]="themeMenu">
    <mat-icon>{{ themeService.selectedTheme()?.icon }}</mat-icon>
  </button>
  <mat-menu #themeMenu="matMenu">
    @for (theme of themeService.getThemes(); track theme.name) {
      <button
        [class.selected-theme]="themeService.selectedTheme()?.name === theme.name"
        mat-menu-item
        (click)="themeService.setTheme(theme.name)"
      >
        <mat-icon>{{ theme.icon }}</mat-icon>
        <span>{{ theme.name | titlecase }} </span>
      </button>
    }
  </mat-menu>
</mat-toolbar>
<mat-drawer-container class="container">
  <mat-drawer #drawer class="nav-sidenav" mode="side">
    <mat-list role="list">
      <mat-list-item routerLink="home" routerLinkActive="active">
        <mat-icon>home</mat-icon> Home</mat-list-item
      >
      <mat-divider></mat-divider>
    </mat-list>
    <mat-list role="list">
      <mat-list-item routerLink="product-list" routerLinkActive="active">
        <mat-icon>inventory_2</mat-icon>
        <span>resource: Products</span>
        @if (productStore.total() > 0) {
          <span
            [matBadge]="productStore.total()"
            matBadgeColor="accent"
            matBadgeOverlap="false"
          ></span>
        }
      </mat-list-item>
      <mat-divider></mat-divider>
    </mat-list>

    <mat-list role="list">
      <mat-list-item routerLink="rx-product-list" routerLinkActive="active">
        <mat-icon>inventory_2</mat-icon>
        <span>rx-resource: Products</span>
        @if (productStore.total() > 0) {
          <span
            [matBadge]="productStore.total()"
            matBadgeColor="accent"
            matBadgeOverlap="false"
          ></span>
        }
      </mat-list-item>
      <mat-divider></mat-divider>
    </mat-list>
  </mat-drawer>
  <mat-drawer-content class="app-container" (click)="drawer.close()">
    <main class="app-content">
      <router-outlet></router-outlet>
    </main>
  </mat-drawer-content>
</mat-drawer-container>
